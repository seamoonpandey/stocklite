name: Build and publish StockLite

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: macos
            targets: dmg,app
          - name: Windows
            os: windows-latest
            artifact: windows
            targets: nsis,msi
          - name: Linux
            os: ubuntu-22.04
            artifact: linux
            targets: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        shell: bash
        run: npm run tauri build -- --bundles "${{ matrix.targets }}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stocklite-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  release:
    name: Publish v1 release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: stocklite-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: StockLite ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.msi
            installers/**/*.deb
            installers/**/*.rpm
